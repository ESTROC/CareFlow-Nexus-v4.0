name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit and API integration tests
        run: cd backend && pytest -q
      - name: Deterministic benchmark
        run: python ml/evaluate_workflow.py
      - name: Python syntax
        run: python -m compileall -q backend/careflow ml integrations
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend,frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate container compose config
        run: JWT_SECRET=0123456789abcdefghijklmnopqrstuvwxyz ADMIN_USERNAME=ci ADMIN_PASSWORD=ci-dummy-long-password POSTGRES_PASSWORD=ci-dummy-password docker compose config -q
      - name: Build images
        run: JWT_SECRET=0123456789abcdefghijklmnopqrstuvwxyz ADMIN_USERNAME=ci ADMIN_PASSWORD=ci-dummy-long-password POSTGRES_PASSWORD=ci-dummy-password docker compose build
